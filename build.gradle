plugins {
    id 'java-library'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.6'
}
group = 'mchorse'
version = '2.8-1.12.2-alpha.1'
base { archivesName = 'bbs-fs' }
java {
    toolchain { languageVersion = JavaLanguageVersion.of(8) }
    withSourcesJar()
}
minecraft {
    mcVersion = '1.12.2'
    username = 'BBSDeveloper'
    extraRunJvmArguments.addAll('-Xmx2G', '-Dfile.encoding=UTF-8')
}
repositories { mavenCentral() }
// OptiFine patches vanilla class names, so its client uses Forge's obfuscated runtime.
def withOptiFine = project.hasProperty('withOptiFine') || gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'runClientOptiFine' }
apply from: 'gradle/optifine.gradle'
configurations {
    embedded
    implementation.extendsFrom(embedded)
}
dependencies {
    embedded 'org.joml:joml:1.10.5'
    annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
    compileOnly 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    // CPU geometry/audio tests use LWJGL's direct-buffer allocator; no GL context is created.
    testRuntimeOnly 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
}
// Audited BBS core is added here as each subsystem becomes runnable.
sourceSets {
    // Modern integration tests depend on systems outside the foundation port.
    test {
        java.setSrcDirs(['src/forgeTest/java'])
        resources.setSrcDirs(['src/forgeTest/resources'])
    }
    main {
        java.setSrcDirs(['src/forge/java', layout.buildDirectory.dir('generated/bbs-core')])
        resources.setSrcDirs(['src/forge/resources'])
    }
    aihelper {
        java.srcDir 'src/aihelper/java'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += compileClasspath
    }
}
tasks.register('generateAssetIndex') {
    def assets = fileTree('src/client/resources/assets/bbs/assets')
    inputs.files assets
    def index = layout.buildDirectory.file('generated/port-resources/assets/bbs/asset-index.txt')
    outputs.file index
    doLast {
        def base = file('src/client/resources/assets/bbs/assets').toPath()
        index.get().asFile.parentFile.mkdirs()
        index.get().asFile.text = assets.files.collect { base.relativize(it.toPath()).toString().replace('\\', '/') }.sort().join('\n')
    }
}
tasks.named('processResources') {
    dependsOn 'generateAssetIndex'
    from('src/client/resources') { include 'assets/bbs/assets/**' }
    from(layout.buildDirectory.dir('generated/port-resources'))
    from('src/main/resources') { include 'assets/bbs/icon.png', 'assets/bbs/licenses/**', 'assets/bbs/textures/block/model.png', 'assets/bbs/sounds/**', 'assets/bbs/sounds.json', 'assets/bbs/shaders/**', 'assets/minecraft/shaders/program/bbs_kawase*' }
}
tasks.named('runClient') {
    onlyIf { !project.hasProperty('forgeReleaseTest') && !withOptiFine }
    if (withOptiFine) dependsOn 'runObfClient'
    dependsOn tasks.named('aihelperClasses'), 'embeddedRuntime'
    classpath += sourceSets.aihelper.output
    workingDir = file('run-forge1122')
    doFirst {
        workingDir.mkdirs()
        // Forge 1.12's ASM scanner cannot parse Java 9 module descriptors.
        classpath = classpath.filter { !configurations.embedded.files.contains(it) } + files(tasks.named('embeddedRuntime').get().archiveFile)
    }
    systemProperty 'aihelper.port', '25612'
    systemProperty 'fml.coreMods.load', 'mchorse.bbs_mod.forge.core.BBSLoadingPlugin'
}
// Exercise the distributable JAR with Forge's obfuscated runtime. The helper is
// a separate test mod and never enters the BBS release or sources JAR.
tasks.register('aihelperJar', Jar) {
    from sourceSets.aihelper.output
    archiveBaseName = 'aihelper-forge1122'
    archiveClassifier = 'dev'
    destinationDirectory = layout.buildDirectory.dir('aihelper')
}
tasks.register('reobfAihelper', com.gtnewhorizons.retrofuturagradle.mcp.ReobfuscatedJar) {
    setInputJarFromTask(tasks.named('aihelperJar'))
    archiveClassifier = ''
    def mainReobf = tasks.named('reobfJar').get()
    mcVersion.set(mainReobf.mcVersion)
    srg.set(mainReobf.srg)
    fieldCsv.set(mainReobf.fieldCsv)
    methodCsv.set(mainReobf.methodCsv)
    exceptorCfg.set(mainReobf.exceptorCfg)
    recompMcJar.set(mainReobf.recompMcJar)
    extraSrgEntries.set(mainReobf.extraSrgEntries)
    extraSrgFiles.from(mainReobf.extraSrgFiles)
    referenceClasspath.from(sourceSets.aihelper.compileClasspath)
}
tasks.named('prepareObfModsFolder') {
    from tasks.named('reobfAihelper')
    if (withOptiFine) from configurations.optifineRuntime
    // JOML is already embedded without its Java 9 module descriptor.
    exclude 'joml-*.jar'
    into file('run-forge1122-obf/mods')
}
tasks.named('runObfClient') {
    workingDir = file('run-forge1122-obf')
    systemProperty 'aihelper.port', '25612'
}
tasks.register('runClientOptiFine') {
    group = 'application'
    description = 'Run Forge 1.12.2 with BBS and the pinned official OptiFine runtime dependency.'
    dependsOn 'runObfClient'
}
tasks.register('embeddedRuntime', Jar) {
    archiveClassifier = 'runtime'
    destinationDirectory = layout.buildDirectory.dir('forge-runtime')
    from { configurations.embedded.collect { zipTree(it) } }
    exclude 'module-info.class', 'META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.register('prepareBbsCore', Sync) {
    from('src/main/java') {
        include file('gradle/forge-core.txt').readLines().findAll { it && !it.startsWith('#') }
    }
    from('src/client/java') {
        include file('gradle/forge-client.txt').readLines().findAll { it && !it.startsWith('#') }
    }
    into layout.buildDirectory.dir('generated/bbs-core')
}
tasks.named('compileJava') {
    dependsOn 'prepareBbsCore'
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
    sourceCompatibility = '17'
    options.release = 8
}
tasks.named('sourcesJar') { dependsOn 'prepareBbsCore' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') { expand version: project.version }
}
tasks.named('jar') {
    manifest { attributes 'FMLCorePlugin': 'mchorse.bbs_mod.forge.core.BBSLoadingPlugin', 'FMLCorePluginContainsFMLMod': 'true' }
    from { configurations.embedded.collect { zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
